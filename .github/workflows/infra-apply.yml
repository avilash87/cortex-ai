name: Infra apply (TFC gate)

# This workflow runs on merge to master for infra changes. It does NOT apply
# anything directly — TFC's VCS integration triggers the full plan automatically.
# This workflow's job is to: (1) confirm the push reached TFC, (2) wait for
# the TFC plan to complete, (3) gate on plan success before the run is eligible
# for "Confirm & Apply" in the TFC UI.
#
# Lloyds-style flow:
#   merge to master → TFC full plan (this workflow waits for it)
#                   → platform engineer reviews plan in TFC UI
#                   → platform engineer clicks "Confirm & Apply"
#                   → resources created/updated in Azure
#
# The manual "Confirm & Apply" step in TFC UI is intentional — no unattended
# applies ever run. CLAUDE.md rule: "never chain generate→apply in one step".

on:
  push:
    branches: [master]
    paths:
      - "infra/envs/**"
      - ".github/workflows/infra-apply.yml"

permissions:
  contents: read

jobs:
  notify-tfc-plan:
    name: Wait for TFC plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: dev
            workspace_id: ${{ vars.TFC_WORKSPACE_ID_DEV }}
          - env: test
            workspace_id: ${{ vars.TFC_WORKSPACE_ID_TEST }}
    steps:
      - name: Wait for TFC speculative plan to complete
        env:
          TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
          WORKSPACE_ID: ${{ matrix.workspace_id }}
        run: |
          echo "Waiting for TFC workspace ${{ matrix.env }} ($WORKSPACE_ID) to finish planning..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf \
              -H "Authorization: Bearer $TFC_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$WORKSPACE_ID/runs?page[size]=1" \
              | python3 -c "import sys,json; r=json.load(sys.stdin)['data']; print(r[0]['attributes']['status']) if r else print('no-runs')")
            echo "  Run status: $STATUS"
            if [[ "$STATUS" == "planned" || "$STATUS" == "planned_and_finished" ]]; then
              echo "Plan complete — ready for manual Confirm & Apply in TFC UI."
              exit 0
            elif [[ "$STATUS" == "errored" || "$STATUS" == "canceled" ]]; then
              echo "Plan failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for TFC plan. Check app.terraform.io manually."
          exit 1

      - name: Remind about manual apply
        if: success()
        run: |
          echo "============================================================"
          echo "  Plan succeeded for ${{ matrix.env }} workspace."
          echo "  Next step: Confirm & Apply at:"
          echo "  https://app.terraform.io/app/avilashj/workspaces/cortex-ai-${{ matrix.env }}/runs"
          echo "  Do NOT auto-apply — manual review is required."
          echo "============================================================"
