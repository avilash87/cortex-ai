name: Services CD

on:
  push:
    branches: [master]
    paths:
      - "services/**"
      - "charts/**"
      - ".github/workflows/services-cd.yml"

permissions:
  id-token: write # required for OIDC federation to Azure
  contents: read

# AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID are non-sensitive identifiers,
# not credentials - stored as repo secrets anyway to avoid hardcoding
# infra-specific values into workflow YAML. The actual authentication is
# still OIDC (azure/login exchanges a GitHub-issued token for an Azure one
# via the federated credential) - no client secret or password is stored
# anywhere.

jobs:
  # Attached to the `dev` GitHub Environment (not just a build step) because
  # that's the only federated credential this SPN has that matches a
  # non-PR trigger - see gh_env in infra/bootstrap/tfc-cloud-setup/main.tf.
  # There's no federated credential for a bare branch-push subject.
  build-and-push:
    name: Build + push to ACR
    # ACR's public network access is disabled (matches the private-endpoints
    # posture everywhere else in this project) - a GitHub-hosted runner has
    # no network path to it at all, confirmed via a real failed run
    # ("CONNECTIVITY_REFRESH_TOKEN_ERROR" - Azure's misleading wording for
    # "can't reach it", not an auth/RBAC problem). This runner lives on
    # vm-cortex-management-dev, inside the same VNet as the ACR's private
    # endpoint, alongside Nexus. Repo is public - see docs/TUTORIAL.md for
    # the accepted-risk tradeoff that decision carries.
    runs-on: self-hosted
    environment: dev
    outputs:
      image-tag-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name acrcortexvx54b

      - uses: docker/setup-buildx-action@v3

      - name: Build + push (immutable sha tag + mutable dev tag)
        uses: docker/build-push-action@v6
        with:
          context: services/console
          push: true
          tags: |
            acrcortexvx54b.azurecr.io/cortex-console:${{ github.sha }}
            acrcortexvx54b.azurecr.io/cortex-console:dev
          platforms: linux/amd64

  # Runs on the self-hosted runner for the same reason as build-and-push:
  # the AKS API server's authorized_ip_ranges restriction means a
  # GitHub-hosted runner has no network path to the cluster at all.
  # Deploys the exact commit's sha-tagged image, not the mutable "dev" tag -
  # avoids a race if another run's push overwrites "dev" between this job
  # and build-and-push.
  deploy-dev:
    name: Deploy to AKS dev
    needs: build-and-push
    runs-on: self-hosted
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials -g rg-cortex-ai-dev -n aks-cortex-dev --admin --overwrite-existing

      - name: helm upgrade --install
        run: |
          helm upgrade --install cortex-console charts/console \
            --namespace dev --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 2m

  # environment: test has a required-reviewer protection rule (this repo's
  # only reviewer is the same person merging - a known limitation of a
  # solo-developer POC, see infra/bootstrap/tfc-cloud-setup/main.tf) - the
  # job pausing here for that approval is real, not simulated.
  deploy-test:
    name: Deploy to AKS test
    needs: deploy-dev
    runs-on: self-hosted
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials -g rg-cortex-ai-dev -n aks-cortex-dev --admin --overwrite-existing

      - name: helm upgrade --install
        run: |
          helm upgrade --install cortex-console charts/console \
            --namespace test --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 2m
